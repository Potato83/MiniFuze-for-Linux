name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libsoup-3.0-dev libjson-c-dev libmicrohttpd-dev libssl-dev pipewire-bin wireplumber xvfb fonts-dejavu-core desktop-file-utils
      - name: Build
        run: make -j2 all build/desktop-smoke
      - name: Numeric and input-validation tests
        run: dbus-run-session -- env MINIFUZE_RUNTIME_TESTS=1 make check
      - name: Isolated GTK integration
        env:
          GTK_A11Y: test
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1024x768x24' python3 tools/test_desktop.py --start-pipewire
      - name: Source archive round-trip
        run: |
          release_version=$(cat VERSION)
          bash tools/package_release.sh
          cd dist
          sha256sum -c minifuze2-${release_version}-source.tar.gz.sha256
          tar -xzf minifuze2-${release_version}-source.tar.gz
          cd minifuze2-${release_version}
          sha256sum -c SHA256SUMS
          make -j2 check
      - name: Prepare release files from a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MF_PACKAGE_PLATFORM: ubuntu-24.04-x86_64
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          bash tools/package_release.sh --binary
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: minifuze-release-files
          path: dist/*.tar.gz*
          if-no-files-found: error
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Build module without loading it
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make kernel KDIR="$headers"
