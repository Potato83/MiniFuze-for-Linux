name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: bash tools/ci_dependencies.sh app
      - name: Build
        run: make -j2 all build/desktop-smoke
      - name: Numeric and input-validation tests
        run: dbus-run-session -- env MINIFUZE_RUNTIME_TESTS=1 make check
      - name: Isolated GTK integration (Russian)
        env:
          GTK_A11Y: test
          LANGUAGE: ru
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1024x768x24' python3 tools/test_desktop.py --start-pipewire
      - name: Isolated GTK integration (English)
        env:
          GTK_A11Y: test
          LANGUAGE: en
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1024x768x24' python3 tools/test_desktop.py --start-pipewire
      - name: Source archive round-trip
        run: |
          release_version=$(cat VERSION)
          bash tools/package_release.sh
          python3 tools/release.py verify --version "$release_version" dist/*.tar.gz
          cd dist
          sha256sum -c minifuze2-${release_version}-source.tar.gz.sha256
          tar -xzf minifuze2-${release_version}-source.tar.gz
          cd minifuze2-${release_version}
          sha256sum -c SHA256SUMS
          make -j2 check
      - name: Prepare platform archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MF_PACKAGE_PLATFORM: ubuntu-24.04-x86_64
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then python3 tools/release.py classify "$RELEASE_TAG"; fi
          bash tools/package_release.sh --binary
          python3 tools/release.py verify --version "$(cat VERSION)" dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: minifuze-release-files
          path: dist/*.tar.gz*
          if-no-files-found: error
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kernel build dependencies
        run: bash tools/ci_dependencies.sh kernel
      - name: Build module without loading it
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make kernel KDIR="$headers"
