name: Prepare GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/build.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minifuze-release-files
          path: dist
      - name: Classify the version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release.py classify "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Verify complete release archives
        run: |
          test "$(head -n 1 docs/release-notes.md)" = "# MiniFuse 2 for Linux $(cat VERSION)"
          python3 tools/release.py verify --version "$(cat VERSION)" dist/*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DRAFT: ${{ steps.version.outputs.draft }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$RELEASE_DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ "$RELEASE_PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          release_url=$(gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --verify-tag "${flags[@]}" --title "MiniFuse 2 for Linux $RELEASE_TAG" --notes-file docs/release-notes.md)
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets,url > /tmp/minifuze-created-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('/tmp/minifuze-created-release.json').read_text())
          assert release['tagName'] == os.environ['RELEASE_TAG']
          assert release['isDraft'] == (os.environ['RELEASE_DRAFT'] == 'true')
          assert release['isPrerelease'] == (os.environ['RELEASE_PRERELEASE'] == 'true')
          expected = {p.name for p in Path('dist').iterdir() if p.name.endswith(('.tar.gz', '.sha256'))}
          assert {asset['name'] for asset in release['assets']} == expected
          PY
          printf '::notice title=GitHub release prepared::%s\n' "$release_url"
          printf 'Release files verified: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
