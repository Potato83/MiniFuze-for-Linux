name: Prepare GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/build.yml
  native:
    uses: ./.github/workflows/native-packages.yml
  publish:
    needs: [validate, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minifuze-release-files
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Verify all release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release.py classify "$RELEASE_TAG"
          test "$RELEASE_TAG" = v0.1.1
          test "$(head -n 1 docs/release-notes.md)" = "# MiniFuse 2 for Linux $(cat VERSION)"
          python3 tools/release.py verify --version "$(cat VERSION)" dist/release/*.tar.gz
          python3 tools/verify_test_release.py dist/release dist/native
      - name: Create and audit test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* dist/native/* --verify-tag --draft --prerelease --title "MiniFuse 2 for Linux $RELEASE_TAG — testing" --notes-file docs/release-notes.md
          mkdir /tmp/minifuze-downloads
          gh release download "$RELEASE_TAG" --dir /tmp/minifuze-downloads
          python3 tools/verify_test_release.py /tmp/minifuze-downloads
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for d in ('dist/release', 'dist/native') for p in Path(d).iterdir() if p.is_file()}
          remote = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('/tmp/minifuze-downloads').iterdir() if p.is_file()}
          assert local == remote, 'Downloaded files differ from the tested artifacts'
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,url > /tmp/minifuze-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('/tmp/minifuze-release.json').read_text())
          assert release['tagName'] == os.environ['RELEASE_TAG'] and not release['isDraft'] and release['isPrerelease']
          print('::notice title=Test release published::'+release['url'])
          PY
